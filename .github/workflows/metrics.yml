name: Metrics

on:
  schedule:
    - cron: "17 3 * * *"   # daily, 03:17 UTC
  workflow_dispatch:        # "Run workflow" button
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

permissions:
  contents: write           # the action commits metrics.svg back to this repo

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # lowlighter/metrics v3.34, pinned to the tag's commit
      - uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: TryCoffee
          filename: metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Warsaw
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
